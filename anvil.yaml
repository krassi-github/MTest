metadata: {description: Test Mobi App to be integrated to MH project later on, logo_img: 'asset:kag2.jpg', title: MobiTest}
name: MobiTest
native_deps:
  head_html: "<script>\n  window.a7GetMeasurements = async function() {\n  const SERVICE_UUID =\n  \"0000fff0-0000-1000-8000-00805f9b34fb\";\n\n  const NOTIFY_UUID =\n  \"0000fff1-0000-1000-8000-00805f9b34fb\";\n\n  const WRITE_UUID =\n  \"0000fff2-0000-1000-8000-00805f9b34fb\";\n\n  const CMD_GET_MEASUREMENTS = new Uint8Array([\n  0x4D, 0xFF, 0x00, 0x09,\n  0x00, 0x00, 0x00, 0x00,\n  0x00, 0x00, 0x00, 0xFD, 0x52\n  ]);\n\n  const sleep = ms =>\n  new Promise(resolve => setTimeout(resolve, ms));\n\n  if (!navigator.bluetooth) {\n  throw new Error(\n  \"Web Bluetooth is not available.\"\n  );\n  }\n\n  const device =\n  await navigator.bluetooth.requestDevice({\n  filters: [\n  {name: \"A7 Touch BT\"}\n  ],\n  optionalServices: [\n  SERVICE_UUID\n  ]\n  });\n\n  let notifyChar = null;\n  let handler = null;\n  let timer = null;\n\n  try {\n  // ONE connection only\n  const server =\n  await device.gatt.connect();\n\n  const service =\n  await server.getPrimaryService(\n  SERVICE_UUID\n  );\n\n  notifyChar =\n  await service.getCharacteristic(\n  NOTIFY_UUID\n  );\n\n  const writeChar =\n  await service.getCharacteristic(\n  WRITE_UUID\n  );\n\n  let received = [];\n\n  const framePromise =\n  new Promise((resolve, reject) => {\n\n  timer = setTimeout(() => {\n  reject(\n  new Error(\n  \"Timeout waiting for measurement data.\"\n  )\n  );\n  }, 60000);\n\n  handler = event => {\n  const value = event.target.value;\n\n  const chunk = new Uint8Array(\n  value.buffer,\n  value.byteOffset,\n  value.byteLength\n  );\n\n  for (const b of chunk) {\n  received.push(b);\n  }\n\n  if (received.length < 4) {\n  return;\n  }\n\n  if (received[0] !== 0x4D) {\n  clearTimeout(timer);\n  reject(\n  new Error(\n  \"Invalid Microlife frame start.\"\n  )\n  );\n  return;\n  }\n\n  const declaredLength =\n  received[2] * 256 +\n  received[3];\n\n  const expectedLength =\n  declaredLength + 4;\n\n  if (\n  received.length >= expectedLength\n  ) {\n  clearTimeout(timer);\n\n  resolve(\n  received.slice(\n  0,\n  expectedLength\n  )\n  );\n  }\n  };\n\n  notifyChar.addEventListener(\n  \"characteristicvaluechanged\",\n  handler\n  );\n  });\n\n  await notifyChar.startNotifications();\n\n  // Same settling delay as Windows version\n  await sleep(500);\n\n  if (writeChar.writeValueWithResponse) {\n  await writeChar.writeValueWithResponse(\n  CMD_GET_MEASUREMENTS\n  );\n  } else {\n  await writeChar.writeValue(\n  CMD_GET_MEASUREMENTS\n  );\n  }\n\n  const frame =\n  await framePromise;\n\n  // -------------------------\n  // Validate frame\n  // -------------------------\n\n  const declaredLength =\n  frame[2] * 256 +\n  frame[3];\n\n  if (\n  frame.length !==\n  declaredLength + 4\n  ) {\n  throw new Error(\n  \"Frame length mismatch.\"\n  );\n  }\n\n  let checksum = 0;\n\n  for (\n  let i = 0;\n  i < frame.length - 1;\n  i++\n  ) {\n  checksum =\n  (checksum + frame[i]) & 0xFF;\n  }\n\n  const receivedChecksum =\n  frame[frame.length - 1];\n\n  if (\n  checksum !==\n  receivedChecksum\n  ) {\n  throw new Error(\n  \"Checksum error: received 0x\" +\n  receivedChecksum\n  .toString(16)\n  .padStart(2, \"0\") +\n  \", calculated 0x\" +\n  checksum\n  .toString(16)\n  .padStart(2, \"0\")\n  );\n  }\n\n  const payload =\n  frame.slice(\n  4,\n  frame.length - 1\n  );\n\n  if (payload.length < 29) {\n  throw new Error(\n  \"Measurement payload too short.\"\n  );\n  }\n\n  const recordCount =\n  payload[3];\n\n  const user =\n  payload[4];\n\n  const PREFIX_SIZE = 29;\n  const RECORD_SIZE = 7;\n\n  const expectedPayloadLength =\n  PREFIX_SIZE +\n  recordCount * RECORD_SIZE;\n\n  if (\n  payload.length !==\n  expectedPayloadLength\n  ) {\n  throw new Error(\n  \"Expected \" +\n  recordCount +\n  \" records (\" +\n  expectedPayloadLength +\n  \" payload bytes), got \" +\n  payload.length\n  );\n  }\n\n  // --------------------------------\n  // Decode 7-byte measurements\n  // --------------------------------\n\n  const pad2 = n =>\n  n.toString().padStart(2, \"0\");\n\n  function decodeMonth(\n    dayByte,\n    hourByte\n  ) {\n    return (\n      ((hourByte & 0x80) >> 4)   // 8\n      | ((hourByte & 0x40) >> 4) // 4\n      | ((dayByte & 0x80) >> 6)  // 2\n      | ((dayByte & 0x40) >> 6)  // 1\n    );\n  }\n  \n  const rawRecords = [];\n\n  for (\n  let offset = PREFIX_SIZE;\n  offset < payload.length;\n  offset += RECORD_SIZE\n  ) {\n  const raw =\n  Array.from(\n  payload.slice(\n  offset,\n  offset + RECORD_SIZE\n  )\n  );\n\n  const systolic = raw[0];\n  const diastolic = raw[1];\n  const pulse = raw[2];\n  const dayByte = raw[3];\n  const hourByte = raw[4];\n  const minute = raw[5];\n  const flags = raw[6];\n\n  const day =\n  dayByte & 0x1F;\n\n  const hour =\n  hourByte & 0x1F;\n\n  const month =\n  decodeMonth(\n  dayByte,\n  hourByte\n  );\n\n  const memoryNo =\n  rawRecords.length + 1;\n\n  if (\n  month < 1 ||\n  month > 12\n  ) {\n  throw new Error(\n  \"Invalid month \" +\n  month +\n  \" in record #\" +\n  memoryNo\n  );\n  }\n\n  if (\n  day < 1 ||\n  day > 31 ||\n  hour > 23 ||\n  minute > 59\n  ) {\n  throw new Error(\n  \"Invalid date/time in record #\" +\n  memoryNo\n          );\n        }\n\n        rawRecords.push({\n          memoryNo: memoryNo,\n          systolic: systolic,\n          diastolic: diastolic,\n          pulse: pulse,\n          month: month,\n          day: day,\n          hour: hour,\n          minute: minute,\n          flags: flags,\n          raw: raw\n        });\n      }\n\n      // --------------------------------\n      // Restore years.\n      //\n      // A7 records do not contain year.\n      // Same algorithm as Windows parser:\n      // work backwards from today's\n      // year/month.\n      // --------------------------------\n\n      const captureDate =\n        new Date();\n\n      const years =\n        new Array(\n          rawRecords.length\n        ).fill(\n          captureDate.getFullYear()\n        );\n\n      let year =\n        captureDate.getFullYear();\n\n      let newerMonth =\n        captureDate.getMonth() + 1;\n\n      for (\n        let i = rawRecords.length - 1;\n        i >= 0;\n        i--\n      ) {\n        const month =\n        rawRecords[i].month;\n\n        if (month > newerMonth) {\n        year -= 1;\n      }\n\n        years[i] = year;\n        newerMonth = month;\n      }\n\n        // --------------------------------\n        // Build decoded records\n        // --------------------------------\n\n        const decoded = [];\n\n        for (\n        let i = 0;\n        i < rawRecords.length;\n        i++\n        ) {\n        const r =\n        rawRecords[i];\n\n        const recordYear =\n        years[i];\n\n        // Exact calendar validation.\n        const dt = new Date(\n        recordYear,\n        r.month - 1,\n        r.day,\n        r.hour,\n        r.minute\n        );\n\n        if (\n        dt.getFullYear() !== recordYear ||\n        dt.getMonth() + 1 !== r.month ||\n        dt.getDate() !== r.day ||\n        dt.getHours() !== r.hour ||\n        dt.getMinutes() !== r.minute\n        ) {\n        throw new Error(\n        \"Invalid calendar date in record #\" +\n        r.memoryNo\n        );\n      }\n\n        const dateText =\n        recordYear +\n        \"/\" +\n        pad2(r.month) +\n        \"/\" +\n        pad2(r.day) +\n        \" \" +\n        pad2(r.hour) +\n        \":\" +\n        pad2(r.minute);\n\n        const displayDate =\n        pad2(r.day) +\n        \"-\" +\n        pad2(r.month) +\n        \"-\" +\n        recordYear +\n        \" \" +\n        pad2(r.hour) +\n        \":\" +\n        pad2(r.minute);\n\n        const timeKey =\n        Number(\n        \"\" +\n        recordYear +\n        pad2(r.month) +\n        pad2(r.day) +\n        pad2(r.hour) +\n        pad2(r.minute)\n        );\n\n        const afScreeningOn =\n        (r.flags & 0x80) !== 0;\n\n        const afDetected =\n        (r.flags & 0x40) !== 0;\n\n        const rawHex =\n        r.raw\n        .map(\n        b =>\n        b.toString(16)\n        .padStart(2, \"0\")\n        .toUpperCase()\n        )\n        .join(\" \");\n\n        decoded.push({\n        memory_no: r.memoryNo,\n        user: user,\n\n        time_key: timeKey,\n        date: dateText,\n        display_date: displayDate,\n\n        sys: r.systolic,\n        dia: r.diastolic,\n        pul: r.pulse,\n\n        af_screening_on:\n        afScreeningOn,\n\n        af_detected:\n        afDetected,\n\n        flags: r.flags,\n        raw_hex: rawHex\n      });\n      }\n\n        const afibRecords =\n        decoded.filter(\n        r => r.af_detected\n        );\n\n        const screeningOffCount =\n        decoded.filter(\n        r => !r.af_screening_on\n        ).length;\n\n        const formatMeasurement = r =>\n        \"#\" +\n        r.memory_no +\n        \": \" +\n        r.display_date +\n        \", \" +\n        r.sys +\n        \"/\" +\n        r.dia +\n        \", pulse \" +\n        r.pul;\n\n        return {\n        deviceName:\n        device.name || \"A7 Touch BT\",\n\n        user: user,\n\n        frameLength:\n        frame.length,\n\n        payloadLength:\n        payload.length,\n\n        records:\n        decoded.length,\n\n        afib:\n        afibRecords.length,\n\n        screeningOff:\n        screeningOffCount,\n\n        periodStart:\n        decoded.length\n        ? decoded[0].display_date\n        : \"\",\n\n        periodEnd:\n        decoded.length\n        ? decoded[\n        decoded.length - 1\n        ].display_date\n        : \"\",\n\n        firstDecoded:\n        decoded.length\n        ? formatMeasurement(\n        decoded[0]\n        )\n        : \"\",\n\n        lastDecoded:\n        decoded.length\n        ? formatMeasurement(\n        decoded[\n        decoded.length - 1\n        ]\n        )\n        : \"\",\n\n        firstRecord:\n        decoded.length\n        ? decoded[0].raw_hex\n        : \"\",\n\n        lastRecord:\n        decoded.length\n        ? decoded[\n        decoded.length - 1\n        ].raw_hex\n        : \"\",\n\n        afibText:\n        afibRecords.length\n        ? afibRecords\n        .map(formatMeasurement)\n        .join(\"\\n\")\n        : \"None\",\n\n        // Това ще използваме на\n        // следващата стъпка за MH server.\n        recordsJson:\n        JSON.stringify(decoded)\n      };\n\n        return {\n        deviceName:\n        device.name || \"A7 Touch BT\",\n\n        user: user,\n        frameLength: frame.length,\n        payloadLength: payload.length,\n        records: recordCount,\n        afib: afibCount,\n        screeningOff:\n        screeningOffCount,\n\n        firstRecord:\n        toHex(firstRecord),\n\n        lastRecord:\n        toHex(lastRecord)\n      };\n\n      } finally {\n        if (timer !== null) {\n        clearTimeout(timer);\n      }\n\n        try {\n        if (notifyChar && handler) {\n        notifyChar.removeEventListener(\n        \"characteristicvaluechanged\",\n        handler\n        );\n      }\n      } catch (_) {\n      }\n\n        try {\n        if (notifyChar) {\n        await notifyChar.stopNotifications();\n      }\n      } catch (_) {\n      }\n\n        try {\n        if (\n        device.gatt &&\n        device.gatt.connected\n        ) {\n        device.gatt.disconnect();\n      }\n      } catch (_) {\n      }\n      }\n      };\n        </script>"
